<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Shop Links</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
    }
    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    .link {
      display: block;
      background: #fff;
      border: 1px solid #ddd;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
      transition: background 0.2s;
    }
    .link:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="your-logo.png" alt="Shop Logo" class="profile-img">
    <h1>My Shop</h1>
    <p>Find all my links below:</p>
    <a href="https://yourshop.com" class="link">🛒 Online Store</a>
    <a href="https://instagram.com/yourshop" class="link">📸 Instagram</a>
    <a href="https://tiktok.com/@yourshop" class="link">🎥 TikTok</a>
    <a href="mailto:youremail@example.com" class="link">✉️ Contact Me</a>
  </div>
</body>
</html>
